# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "wanderbricks-platform"

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog that all WanderBricks platform assets are published to"
    default: genie_code_workshop
  schema_prefix:
    description: "Prefix for the medallion schemas (<prefix>_bronze / _silver / _gold)"
    default: wanderbricks
  source_catalog:
    description: "Catalog holding the read-only WanderBricks source data"
    default: samples
  source_schema:
    description: "Schema holding the read-only WanderBricks source data (16 tables)"
    default: wanderbricks

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405607225336205.5.azuredatabricks.net

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://adb-7405607225336205.5.azuredatabricks.net
      # We always use /Users/heena.refai@databricks.com for all resources to make sure we only have a single copy.
      root_path: /Users/heena.refai@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as heena.refai@databricks.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: heena.refai@databricks.com
